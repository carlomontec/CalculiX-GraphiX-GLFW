name: Release & Binary Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install glfw pkg-config cmake

      - name: Configure and Build (Standalone Static GLFW)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTATIC_GLFW=ON
          cmake --build build --config Release --parallel

      - name: Inspect binary dependencies
        run: |
          echo "=== Dynamic link check ==="
          otool -L bin/cgx_glfw
          if otool -L bin/cgx_glfw | grep -q "libglfw"; then
            echo "ERROR: libglfw was dynamically linked instead of statically baked."
            exit 1
          fi

      - name: Headless sanity test
        run: |
          ./bin/cgx_glfw -bg test/test_vtu.fbl
          test -s all.vtu

      - name: Prepare distribution asset
        run: |
          mkdir -p dist
          cp bin/cgx_glfw dist/cgx_glfw-macos-arm64
          chmod +x dist/cgx_glfw-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cgx_glfw-macos-arm64
          path: dist/cgx_glfw-macos-arm64

  build-linux-x86_64:
    name: Build Linux (x86_64 / glibc)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            fonts-dejavu-core \
            fonts-liberation

      - name: Configure and Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Headless sanity test
        run: |
          ./bin/cgx_glfw -bg test/test_vtu.fbl
          test -s all.vtu

      - name: Prepare distribution asset
        run: |
          mkdir -p dist
          cp bin/cgx_glfw dist/cgx_glfw-linux-x86_64
          chmod +x dist/cgx_glfw-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cgx_glfw-linux-x86_64
          path: dist/cgx_glfw-linux-x86_64

  build-windows-x64:
    name: Build Windows (x64 / MinGW-w64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 & MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure and Build with CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Headless sanity test
        shell: msys2 {0}
        run: |
          ./bin/cgx_glfw.exe -bg test/test_vtu.fbl
          test -s all.vtu

      - name: Prepare distribution asset
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp bin/cgx_glfw.exe dist/cgx_glfw-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cgx_glfw-windows-x86_64
          path: dist/cgx_glfw-windows-x86_64.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-linux-x86_64, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum cgx_glfw-* > SHA256SUMS.txt
          echo "=== Generated SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/cgx_glfw-macos-arm64
            dist/cgx_glfw-linux-x86_64
            dist/cgx_glfw-windows-x86_64.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
