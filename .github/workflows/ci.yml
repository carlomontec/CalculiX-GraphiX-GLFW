name: CI Matrix Build & Headless Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-macos-arm64:
    name: macOS (Apple Silicon arm64)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install glfw pkg-config cmake gnuplot

      - name: Configure CMake (Standalone Static GLFW)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTATIC_GLFW=ON

      - name: Build binary
        run: |
          cmake --build build --config Release --parallel

      - name: Inspect binary dependencies
        run: |
          echo "=== Dynamic link check (should contain ZERO Homebrew dylibs) ==="
          otool -L bin/cgx_glfw
          if otool -L bin/cgx_glfw | grep -qE "libglfw|/opt/homebrew"; then
            echo "ERROR: libglfw or a Homebrew dylib was dynamically linked instead of statically baked."
            exit 1
          fi

      - name: Run headless regression test (-bg)
        run: |
          ./bin/cgx_glfw -bg test/test_vtu.fbl

      - name: Validate generated VTU & PVD outputs
        run: |
          test -s all.vtu
          test -s all.pvd
          echo "[OK] Headless batch execution and VTU export validated successfully on macOS."

      - name: Run Automated Test Suite (CTest)
        run: |
          ctest --test-dir build --output-on-failure


  build-test-linux-x86_64:
    name: Linux (x86_64 / glibc)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            fonts-dejavu-core \
            fonts-liberation \
            gnuplot

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build binary
        run: |
          cmake --build build --config Release --parallel

      - name: Run headless regression test (-bg)
        run: |
          ./bin/cgx_glfw -bg test/test_vtu.fbl

      - name: Validate generated VTU & PVD outputs
        run: |
          test -s all.vtu
          test -s all.pvd
          echo "[OK] Headless batch execution and VTU export validated successfully on Linux x86_64."

      - name: Run Automated Test Suite (CTest)
        run: |
          ctest --test-dir build --output-on-failure

  build-test-linux-arm64:
    name: Linux (ARM64 aarch64 / Raspberry Pi)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            fonts-dejavu-core \
            fonts-liberation \
            python3 \
            gnuplot

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build binary
        run: |
          cmake --build build --config Release --parallel

      - name: Run headless regression test (-bg)
        run: |
          ./bin/cgx_glfw -bg test/test_vtu.fbl

      - name: Validate generated VTU & PVD outputs
        run: |
          test -s all.vtu
          test -s all.pvd
          echo "[OK] Headless batch execution and VTU export validated successfully on Linux ARM64."

      - name: Run Automated Test Suite (CTest)
        run: |
          ctest --test-dir build --output-on-failure

  build-test-windows-x64:
    name: Windows (x64 / MinGW-w64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Windows PowerShell scripts (install.ps1, uninstall.ps1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($scriptName in @("install.ps1", "uninstall.ps1")) {
            $bytes = [System.IO.File]::ReadAllBytes($scriptName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$scriptName contains a UTF-8 BOM, which breaks 'irm ... | iex' in Windows PowerShell 5.1."
            }
            $nonAscii = $bytes | Where-Object { $_ -gt 0x7F }
            if ($nonAscii.Count -gt 0) {
              throw "$scriptName contains $($nonAscii.Count) non-ASCII byte(s); keep PowerShell 1-liner scripts pure ASCII for PS 5.1 compatibility."
            }
            $content = [System.IO.File]::ReadAllText($scriptName, [System.Text.Encoding]::ASCII)
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($scriptName): $($_.Message) at line $($_.Extent.StartLineNumber)" }
              throw "$scriptName failed PowerShell parsing with $($errors.Count) error(s)."
            }
            [void][scriptblock]::Create($content)
            Write-Host "[OK] $scriptName is ASCII/no-BOM and parses cleanly for 'irm | iex'."
          }

      - name: Setup MSYS2 & MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gnuplot

      - name: Configure and Build with CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Inspect binary DLL dependencies
        shell: msys2 {0}
        run: |
          echo "=== Dynamic DLL check (should contain ZERO MSYS2/MinGW runtime DLLs) ==="
          objdump -p bin/cgx_glfw.exe | grep "DLL Name:"
          if objdump -p bin/cgx_glfw.exe | grep -iE "DLL Name:.*(glfw|libgcc|libstdc\+\+|libwinpthread|msys-)"; then
            echo "ERROR: Unexpected MSYS2/MinGW runtime DLL dependency detected."
            exit 1
          fi

      - name: Run headless regression test (-bg)
        shell: msys2 {0}
        run: |
          ./bin/cgx_glfw.exe -bg test/test_vtu.fbl
          test -s all.vtu
          test -s all.pvd
          echo "[OK] Headless batch execution and VTU export validated successfully on Windows."

      - name: Run Automated Test Suite (CTest)
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure

      - name: Validate Windows Inno Setup script (setup.iss)
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=2.23-ci" packaging\windows\setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path "dist\CalculiX-GraphiX-GLFW-Setup-windows-x86_64.exe")) {
            throw "Expected Setup executable was not generated."
          }
          Write-Host "[OK] packaging\windows\setup.iss compiled successfully."

